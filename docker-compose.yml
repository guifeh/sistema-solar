version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/SolarSystem.Api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=solar;Username=solaruser;Password=solarpass
      - Jwt__Key=${JWT_KEY:-solar-system-jwt-secret-key-must-be-at-least-32-chars}
      - Jwt__Issuer=sistema-solar
      - Jwt__Audience=sistema-solar
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=solar
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-solarpass}
      - Azure__StorageConnectionString=${AZURE_STORAGE_CONNECTION_STRING:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solar
      POSTGRES_USER: solaruser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-solarpass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solaruser -d solar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: solar
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-solarpass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
